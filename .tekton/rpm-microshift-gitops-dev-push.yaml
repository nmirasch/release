apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/nmirasch/release?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "dev_microshift_rpm_main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: gitops-main
    appstudio.openshift.io/component: rpm-microshift-gitops-dev
    pipelines.appstudio.openshift.io/type: build
  name: rpm-microshift-gitops-dev-on-push
  namespace: rh-openshift-gitops-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: ociStorage
      value: quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/rpm-microshift-gitops-dev:on-pr-{{revision}}
    - name: path-context
      value: rpms/microshift-gitops
    - name: package-name
      value: microshift-gitops
    - name: target-branch
      value: "{{ target_branch }}"
    - name: hermetic
      value: "true"
    - name: build-architectures
      value:
      - aarch64
    - name: enableSymlinkCheck
      value: false
  pipelineRef:
      name: build-rpm-package
  taskRunTemplate:
    serviceAccountName: build-pipeline-rpm-microshift-gitops-dev
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
