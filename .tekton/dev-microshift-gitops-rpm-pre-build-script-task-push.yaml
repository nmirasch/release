apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/nmirasch/release?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "rpm-pre-build-script-task" && ( "rpms/microshift-gitops/***".pathChanged()
      || ".tekton/dev-microshift-gitops-rpm-pre-build-script-task-push.yaml".pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: test-rpms-builds
    appstudio.openshift.io/component: dev-microshift-gitops-rpm-pre-build-script-task
    pipelines.appstudio.openshift.io/type: build
  name: dev-microshift-gitops-rpm-pre-build-script-task-on-push
  namespace: rh-openshift-gitops-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: ociStorage
    value: quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/dev-microshift-gitops-rpm-pre-build-script-task:{{revision}}
  - name: monorepo-subdir
    value: rpms/microshift-gitops
  - name: specfile
    value: microshift-gitops.spec
  - name: package-name
    value: microshift-gitops
  - name: target-branch
    value: "{{ target_branch }}"
  - name: pre-build-task-url
    value: '{{source_url}}'
  - name: pre-build-task-revision
    value: '{{target_branch}}'
  - name: hermetic
    value: "true"
  - name: build-architectures
    value:
    - aarch64
    - x86_64
  - name: pre-build-script-image
    value: "registry.access.redhat.com/ubi9/ubi:latest"
  - name: pre-build-script-content
    value: |
      #!/usr/bin/env bash
      set -euxo pipefail
      
      echo "--- Preparing sources for RPM build  ---"
      echo "--- Creating argo-cd-sources.tar.gz from correct internal directory  ---"
      tar -czvf ./rpms/microshift-gitops/argo-cd-sources.tar.gz --transform="s,^argo-cd,argo-cd," -C ./sources argo-cd
      
  - name: enableSymlinkCheck
    value: false
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: pathInRepo
      value: .tekton/build-rpm-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-dev-microshift-gitops-rpm-pre-build-script-task
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
