apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/nmirasch/release?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "rpm-microshift-gitops-dist-git" && ( "rpms/microshift-gitops/***".pathChanged()
      || ".tekton/rpm-microshift-gitops-dist-git-pull-request.yaml".pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: test-rpms-builds
    appstudio.openshift.io/component: rpm-microshift-gitops-dist-git
    pipelines.appstudio.openshift.io/type: build
  name: rpm-microshift-gitops-dist-git-on-pull-request
  namespace: rh-openshift-gitops-tenant
spec:
  params:
  - name: ociStorage
    value: quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/rpm-microshift-gitops-dist-git:{{revision}}
  - name: monorepo-subdir
    value: rpms/microshift-gitops
  - name: specfile
    value: microshift-gitops.spec
  - name: package-name
    value: microshift-gitops
  - name: git-url
    value: "https://gitlab.cee.redhat.com/nmirasch/gitops-midstream-repos"
  - name: revision
    value: "{{ revision }}"
  - name: target-branch
    value: "gitops-1.19-rhel-9"
  - name: hermetic
    value: "true"
  - name: build-architectures
    value:
    - aarch64
    - x86_64
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/build-rpm-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rpm-microshift-gitops-dist-git
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
